{% if messages %}
    <div class="messages">
        {% for message in messages %}
            <p class="notice{% if message.level_tag == 'error' or message.level_tag == 'warning' %} review-notice{% endif %}"
               role="{% if message.level_tag == 'error' or message.level_tag == 'warning' %}alert{% else %}status{% endif %}">{{ message }}</p>
        {% endfor %}
    </div>
{% endif %}
