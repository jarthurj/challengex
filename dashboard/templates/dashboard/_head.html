<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.1.11"></script>
{% load static %}
<link rel="icon" href="{% static 'dashboard/favicon.ico' %}">
<style type="text/tailwindcss">
  @theme {
    --color-usps-navy: #004b87;
    --color-usps-blue: #333366;
    --color-usps-red: #d52b1e;
  }

@layer base {
  body { @apply mx-auto max-w-6xl bg-slate-50 px-4 py-6 font-sans text-slate-800 antialiased; }
  h1 { @apply mb-3 text-3xl font-extrabold tracking-tight text-usps-navy; }
  h2 { @apply mt-8 mb-3 border-l-4 border-usps-red pl-3 text-xl font-bold text-usps-navy; }
  h3, h4 { @apply mt-4 mb-2 font-semibold text-usps-navy; }
  p { @apply mb-3; }
  a { @apply text-usps-blue underline-offset-2 hover:underline; }
  main ul { @apply mb-3 list-disc pl-6; }
  :focus-visible { @apply outline-2 outline-offset-2 outline-usps-blue; }
}

@layer components {
  /* Accessibility helpers */
  .visually-hidden { @apply sr-only; }
  .skip-link { @apply sr-only focus:not-sr-only focus:absolute focus:left-2 focus:top-2 focus:z-50 focus:rounded focus:bg-white focus:px-3 focus:py-2; }

  /* Nav */
  .main-nav { @apply mb-6 flex flex-wrap items-center gap-1 rounded-xl border-b-4 border-usps-red bg-usps-navy p-2 shadow; }
  .main-nav a { @apply flex items-center rounded-lg px-4 py-2 text-lg font-medium leading-none text-white no-underline hover:bg-white/15 hover:no-underline; }
  .main-nav a[aria-current="page"] { @apply bg-white text-usps-navy; } 
  .main-nav .brand { @apply mr-3 flex items-center gap-2 py-1 text-lg font-extrabold; }
  .main-nav .brand-logo { @apply h-10 w-auto rounded bg-white p-1; }
  .main-nav .nav-toggle { @apply ml-auto bg-transparent px-3 py-2 text-2xl leading-none text-white hover:bg-white/15 md:hidden; }
  .nav-links { @apply hidden w-full flex-col gap-1 pt-2 md:flex md:w-auto md:flex-row md:pt-0; }
  .nav-links.open { @apply flex; }
  /* Cards */
  .cards { @apply grid list-none grid-cols-[repeat(auto-fit,minmax(270px,1fr))] gap-4 p-0; }
  .card { @apply rounded-xl border border-t-4 border-slate-200 border-t-usps-blue bg-white p-5 shadow-sm transition hover:shadow-md; }
  .card h3 { @apply mt-0; }
  .card dt { @apply mt-2 text-sm text-slate-600; }
  .card dd { @apply m-0; }
  .kpi { @apply my-1 text-3xl font-extrabold text-usps-navy; }
  .small { @apply text-sm text-slate-600; }
  .help { @apply text-sm text-slate-600; }
  .footnote { @apply text-sm text-slate-600; }

  /* Notices & badges */
  .notice { @apply rounded-lg border-l-4 border-usps-blue bg-blue-50 p-4; }
  .review-notice { @apply border-amber-700 bg-amber-50; }
  .review { @apply font-semibold text-amber-800; }
  .badge { @apply mr-1 inline-block whitespace-nowrap rounded-full border border-slate-400 bg-slate-100 px-2.5 py-0.5 text-xs font-medium; }
  .badge.review { @apply border-amber-700 bg-amber-50 text-amber-900; }

  /* Tables */
  .table-wrapper { @apply mb-6 overflow-x-auto rounded-lg border border-slate-200 shadow-sm; }
  table { @apply w-full border-collapse bg-white text-sm; }
  caption { @apply bg-white px-3 py-3 text-left font-semibold text-slate-700; }
  th, td { @apply border border-slate-200 px-3 py-2 text-left align-top; }
  thead th { @apply border-usps-navy bg-usps-navy text-white; }
  tbody th { @apply bg-slate-50 font-semibold; }
  tbody tr:nth-child(even) td { @apply bg-slate-50/60; }
  td.num, td.numeric { @apply whitespace-nowrap text-right tabular-nums; }
  .bar { @apply h-3.5 min-w-[2px] rounded bg-usps-red; }
  .notes { @apply whitespace-pre-line; }

  /* Detail page */
  .metadata { @apply my-6 grid grid-cols-[repeat(auto-fit,minmax(180px,1fr))] gap-4; }
  .metadata div { @apply rounded-lg border border-slate-200 bg-white p-3 shadow-sm; }
  .metadata dt { @apply text-xs uppercase tracking-wide text-slate-500; }
  .metadata dd { @apply m-0 mt-1 break-words font-semibold text-usps-navy; }
  .from-report blockquote { @apply mb-4 border-l-4 border-usps-blue bg-blue-50 px-4 py-3; }
  .from-report cite { @apply text-sm not-italic text-slate-600; }

  /* Forms */
  form { @apply mb-6 flex flex-wrap items-center gap-3; }
  form.filters { @apply items-end gap-x-5 rounded-xl border border-slate-200 bg-white p-4 shadow-sm; }
  form.filters label { @apply flex flex-col gap-1 text-sm font-medium; }
  form.filters label.inline { @apply flex-row items-center; }
  input[type="search"], select { @apply max-w-full rounded-md border border-slate-400 bg-white px-3 py-2; }
  button { @apply cursor-pointer rounded-md bg-usps-red px-4 py-2 font-semibold text-white hover:bg-red-800; }
  .year-dropdown { @apply relative; }
  .year-dropdown summary { @apply cursor-pointer rounded-md border border-slate-400 bg-white px-3 py-2; }
  .year-options { @apply absolute z-10 max-h-56 min-w-[150px] overflow-y-auto rounded-md border border-slate-400 bg-white p-2 shadow-lg; }
  .year-options label { @apply flex-row whitespace-nowrap p-1 font-normal; }

  /* Chart */
  .chart { @apply relative h-[420px] rounded-xl border border-slate-200 bg-white p-4 shadow-sm; }
}
</style>
