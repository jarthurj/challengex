
<h1>Browse tables</h1>

<form method="get">
    <input
        type="search"
        name="q"
        value="{{ query }}"
        placeholder="Search title or source ID"
    >

    <label for="year">Year:</label>
    <select name="year" id="year">
    <option value="">All years</option>

    {% for available_year in years %}
        <option value="{{ available_year }}"
            {% if year == available_year|stringformat:"s" %}selected{% endif %}>
            {{ available_year }}
        </option>
    {% endfor %}
</select>

    <button type="submit">Search</button>
    <a href="{% url 'table-list' %}">Clear</a>
</form>

<table>
    <thead>
        <tr>
            <th>Year</th>
            <th>Page</th>
            <th>Number</th>
            <th>Title</th>
            <th>Source ID</th>
        </tr>
    </thead>
    <tbody>
        {% for table in tables %}
            <tr>
                <td>{{ table.year }}</td>
                <td>{{ table.page }}</td>
                <td>{{ table.table_number }}</td>
                <td>
                    <a href="{% url 'table-detail' table.pk %}">
                        {{ table.title|default:"Untitled" }}
                    </a>
                </td>
                <td>{{ table.source_id }}</td>
            </tr>
        {% empty %}
            <tr>
                <td colspan="5">No matching tables found.</td>
            </tr>
        {% endfor %}
    </tbody>
</table>
